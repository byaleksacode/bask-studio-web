<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Error 404</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(/assets/fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/inter-tight-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-style:normal;font-weight:600;font-display:swap;src:url(/assets/fonts/inter-tight-latin-600-normal.woff2) format('woff2')}
/* 404 como impresión fallida: el número se imprime capa a capa y en la última capa se desplaza (layer shift) */
:root{color-scheme:light;
  --crudo:#FFFEF8;--fondo:#F1F1F1;--tinta:#252525;--verde:#006039;--suave:rgba(37,37,37,.55);--linea:rgba(37,37,37,.14);
  --ui:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;--gr:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px));--grr:max(16px,env(safe-area-inset-right,0px));--ease:cubic-bezier(.19,1,.22,1)}
@media(min-width:1120px){:root{--gl:36px;--grr:36px}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html,body{background:var(--crudo)}
body{color:var(--tinta);font-family:var(--ui);font-size:12px;line-height:1.3;-webkit-font-smoothing:antialiased}
a{color:inherit}
.app{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--crudo);padding:0 var(--grr) 0 var(--gl)}
header{height:42px}
footer{min-height:35px;padding-top:8px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
@media(min-width:1120px){header{height:32px}}
.logo{font-family:var(--gr);font-weight:600;font-size:16px;letter-spacing:-.03em;text-decoration:none}
main{background:var(--fondo);display:grid;align-content:center;justify-items:center;text-align:center;gap:clamp(18px,4svh,36px);padding:32px var(--grr) 40px var(--gl)}
.k{font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--verde)}

/* el número */
.num{position:relative;font-family:var(--gr);font-weight:600;font-size:clamp(150px,44vw,360px);line-height:.8;letter-spacing:-.06em;user-select:none}
.num .ghost{color:transparent;-webkit-text-stroke:1px var(--linea);display:block}
.num .ok,.num .fallo{position:absolute;inset:0;display:block;
  background:repeating-linear-gradient(180deg,var(--tinta) 0 .016em,transparent .016em .024em);-webkit-background-clip:text;background-clip:text;color:transparent}
.num .ok{clip-path:inset(100% 0 0 0);animation:imprime 3.2s steps(40,end) .4s forwards}
.num .fallo{clip-path:inset(0 0 100% 0);background:repeating-linear-gradient(180deg,var(--verde) 0 .016em,transparent .016em .024em);-webkit-background-clip:text;background-clip:text}
.num .fallo{animation:capa .01s 3.6s forwards,shift .7s var(--ease) 3.65s forwards}
@keyframes imprime{to{clip-path:inset(18% 0 0 0)}}
@keyframes capa{to{clip-path:inset(0 0 82% 0)}}
@keyframes shift{to{transform:translateX(.09em)}}
/* boquilla */
.noz{position:absolute;left:0;width:14px;height:20px;top:100%;animation:sube 3.2s steps(40,end) .4s forwards,barre .45s linear .4s 7 alternate,quieta .1s 3.6s forwards}
.noz::before{content:"";position:absolute;inset:0 0 8px 0;background:var(--tinta)}
.noz::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:8px;background:var(--tinta);clip-path:polygon(0 0,100% 0,60% 100%,40% 100%)}
@keyframes sube{to{top:18%}}
@keyframes barre{from{left:0}to{left:calc(100% - 14px)}}
@keyframes quieta{to{left:calc(100% - 14px);top:-6%;opacity:.0}}

h1{font-family:var(--gr);font-weight:400;font-size:clamp(28px,7vw,52px);line-height:1;letter-spacing:-.045em;text-wrap:balance;max-width:14em}
.sub{font-size:15px;line-height:1.4;color:var(--suave);max-width:34ch;text-wrap:pretty}
.log{display:grid;gap:4px;font-variant-numeric:tabular-nums;color:var(--suave);border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);padding:10px 0;min-width:min(320px,100%)}
.log div{display:flex;justify-content:space-between;gap:24px}
.log b{font-weight:500;color:var(--tinta)}
.log .err b{color:var(--verde)}
.btn{display:inline-flex;align-items:center;height:36px;padding:0 18px;border-radius:30px;background:var(--tinta);color:var(--crudo);text-decoration:none;font-size:12px;transition:background .3s}
.btn:hover{background:var(--verde)}
:focus-visible{outline:1px solid var(--verde);outline-offset:2px}
.rv{opacity:0;transform:translateY(12px);animation:in .9s var(--ease) forwards}
@keyframes in{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.num .ok{clip-path:inset(18% 0 0 0)}.num .fallo{clip-path:inset(0 0 82% 0);transform:translateX(.09em)}.noz{display:none}.rv{opacity:1;transform:none}}

/* escritorio: todo en una pantalla, sin deslizar */
@media(min-width:900px){
  .app{height:100svh;min-height:0}
  main{gap:clamp(10px,2.2svh,22px);padding-top:clamp(12px,3svh,32px);padding-bottom:clamp(12px,3svh,32px);min-height:0}
  .num{font-size:min(30svh,360px)}
  h1{font-size:min(5.4svh,48px)}
  .sub{font-size:min(1.9svh,15px)}
  .log{padding:min(1.2svh,10px) 0;gap:2px}
}

/* interacción */
.num{background:none;border:0;color:inherit;cursor:pointer;padding:0;display:block}
.num:hover .fallo{transform:translateX(.13em)!important;transition:transform .5s var(--ease)}
.num:active .fallo{transform:translateX(.05em)!important}
/* salida: las capas de la página se desplazan antes de ir al inicio */
.saliendo main>*{animation:capas .55s var(--ease) forwards!important}
.saliendo main>*:nth-child(odd){--dx:.6em}.saliendo main>*:nth-child(even){--dx:-.6em}
@keyframes capas{0%{opacity:1;transform:none}40%{transform:translateX(var(--dx))}100%{opacity:0;transform:translateX(calc(var(--dx)*2))}}
</style>
</head>
<body>
<div class="app">
  <header><a class="logo" href="/">BASK STUDIO</a><span>Error 404</span></header>

  <main>
    <p class="k rv" style="animation-delay:.2s">Impresión fallida</p>
    <button type="button" class="num" id="num" aria-label="Volver a imprimir el 404" title="Volver a imprimir">
      <span class="ghost" aria-hidden="true">404</span>
      <span class="ok" aria-hidden="true">404</span>
      <span class="fallo" aria-hidden="true">404</span>
      <span class="noz" aria-hidden="true"></span>
    </button>
    <h1 class="rv" style="animation-delay:3.9s">Esta página se ha despegado de la cama.</h1>
    <p class="sub rv" style="animation-delay:4.05s">Hemos perdido el hilo en la última capa. La pieza que buscas no existe o se ha movido.</p>
    <div class="log rv" style="animation-delay:4.2s" aria-label="Registro de la impresora">
      <div><span>Capa</span><b>404 / 404</b></div>
      <div><span>Altura de capa</span><b>0,2 mm</b></div>
      <div class="err"><span>Estado</span><b>Desplazamiento de capa</b></div>
    </div>
    <a class="btn rv" id="volver" style="animation-delay:4.35s" href="/">Volver al inicio</a>
  </main>

  <footer><span>© 2026 BASK STUDIO</span><span>Fabricación aditiva</span></footer>
</div>
<script>
(function(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const num=document.getElementById('num');
  /* al pulsar el 404: se vuelve a imprimir desde la primera capa y falla otra vez */
  num.addEventListener('click',()=>{
    if(reduce)return;
    num.querySelectorAll('.ok,.fallo,.noz').forEach(el=>{
      el.style.animation='none';el.style.transform='';void el.offsetWidth;el.style.animation='';
      if(el.classList.contains('ok'))el.style.animationDelay='0s';
      if(el.classList.contains('noz'))el.style.animationDelay='0s,0s,3.2s';
      if(el.classList.contains('fallo'))el.style.animationDelay='3.2s,3.25s';
    });
  });
  /* volver al inicio con desplazamiento de capas */
  document.getElementById('volver').addEventListener('click',e=>{
    if(reduce)return;
    e.preventDefault();const href=e.currentTarget.href;
    document.body.classList.add('saliendo');setTimeout(()=>location.href=href,560);
  });
})();
</script>
</body>
</html>
